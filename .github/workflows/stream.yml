name: Telegram 24/7 Live Stream

on:
  workflow_dispatch: # يتيح لك تشغيل البث وإيقافه يدوياً بضغطة زر

jobs:
  live_stream:
    runs-on: ubuntu-latest

    steps:
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Start Streaming
      run: |
        # استبدل الرابط أدناه برابط بث مباشر دائم للقرآن أو الأخبار (بصيغة m3u8 أو mp4)
        STREAM_SOURCE="https://mp3quran.net" 
        
        ffmpeg -re -loop 1 -i "$STREAM_SOURCE" -c:v libx264 -b:v 2000k -c:a aac -b:a 128k -f flv "${{ secrets.STREAM_URL }}/${{ secrets.STREAM_KEY }}"
