name: Telegram 24/7 Live Stream

on:
  workflow_dispatch: # تشغيل يدوياً بضغطة زر

jobs:
  live_stream:
    runs-on: ubuntu-latest

    steps:
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Start Streaming
      run: |
        # رابط بث سحابي مباشر وصافي لإذاعة القرآن الكريم (صوت حي ومستمر)
        AUDIO_SOURCE="http://quran-radio.org;"
        
        # إنشاء خلفية شاشة سوداء تلقائياً مدمجة مع الصوت ليقبلها تلجرام كفيديو
        ffmpeg -re -f lavfi -i color=c=black:s=640x360:r=25 -i "$AUDIO_SOURCE" \
        -c:v libx264 -preset veryfast -b:v 500k -bufsize 1000k \
        -c:a aac -b:a 128k -ar 44100 -flvflags +no_duration_filesize \
        -f flv "${{ secrets.STREAM_URL }}/${{ secrets.STREAM_KEY }}"
